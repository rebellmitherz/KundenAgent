<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rebellsystem Sales Operator</title>
<style>
/* ─── Reset & Basis ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #070b14;
  --bg2:         #0b1120;
  --card:        #0d1526;
  --card2:       #111d33;
  --border:      #1a2a45;
  --border2:     #243555;
  --cyan:        #00d4ff;
  --cyan-dim:    rgba(0, 212, 255, 0.12);
  --cyan-glow:   rgba(0, 212, 255, 0.35);
  --green:       #00e676;
  --green-dim:   rgba(0, 230, 118, 0.12);
  --amber:       #ffab00;
  --amber-dim:   rgba(255, 171, 0, 0.12);
  --red:         #ff4757;
  --text1:       #dce8f5;
  --text2:       #7a93b8;
  --text3:       #435470;
  --radius:      14px;
  --radius-sm:   8px;
  --shadow:      0 4px 32px rgba(0,0,0,0.6);
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
               system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ─── Layout ─────────────────────────────────────────────────────────── */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 1100px;
  margin: 0 auto;
}

/* ─── Header ─────────────────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px 0;
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.orb {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #00eaff 0%, #00a8d4 50%, #005f8a 100%);
  box-shadow: 0 0 18px var(--cyan-glow), 0 0 6px var(--cyan);
  animation: pulse 3s ease-in-out infinite;
  flex-shrink: 0;
}

.orb.running {
  background: radial-gradient(circle at 40% 35%, #a78bfa 0%, #7c3aed 50%, #3b1a8a 100%);
  box-shadow: 0 0 22px rgba(139,92,246,0.5), 0 0 8px #a78bfa;
  animation: spin-glow 1.8s linear infinite;
}

@keyframes pulse {
  0%,100% { box-shadow: 0 0 14px var(--cyan-glow), 0 0 4px var(--cyan); transform: scale(1); }
  50%      { box-shadow: 0 0 28px var(--cyan-glow), 0 0 10px var(--cyan); transform: scale(1.06); }
}

@keyframes spin-glow {
  0%   { box-shadow: 0 0 22px rgba(139,92,246,0.5), 0 0 8px #a78bfa; transform: scale(1) rotate(0deg); }
  50%  { box-shadow: 0 0 36px rgba(139,92,246,0.7), 0 0 14px #c4b5fd; transform: scale(1.08) rotate(180deg); }
  100% { box-shadow: 0 0 22px rgba(139,92,246,0.5), 0 0 8px #a78bfa; transform: scale(1) rotate(360deg); }
}

.logo-text {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text2);
}

.logo-text span { color: var(--cyan); }

.status-dot {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text3);
  letter-spacing: 0.06em;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: blink 2.4s ease-in-out infinite;
}

.dot.running { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: blink 0.8s ease-in-out infinite; }
.dot.idle    { background: var(--text3); box-shadow: none; animation: none; }

@keyframes blink {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.3; }
}

/* ─── Tabs ───────────────────────────────────────────────────────────── */
.tabs {
  display: flex;
  gap: 4px;
  padding: 18px 28px 0;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.tab {
  padding: 9px 20px;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  font-size: 13px;
  font-weight: 500;
  color: var(--text3);
  cursor: pointer;
  border: 1px solid transparent;
  border-bottom: none;
  transition: color 0.2s, background 0.2s;
  letter-spacing: 0.04em;
  user-select: none;
}

.tab:hover { color: var(--text2); }

.tab.active {
  color: var(--cyan);
  background: var(--card);
  border-color: var(--border);
  border-bottom-color: var(--card);
  margin-bottom: -1px;
}

/* ─── Content ────────────────────────────────────────────────────────── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 28px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}

.content::-webkit-scrollbar { width: 5px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.view { display: none; }
.view.active { display: block; }

/* ─── Status View ────────────────────────────────────────────────────── */
.status-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

@media (max-width: 700px) { .status-grid { grid-template-columns: 1fr; } }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 24px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  background: radial-gradient(ellipse at 10% 0%, var(--cyan-dim) 0%, transparent 60%);
  pointer-events: none;
}

.card-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 14px;
}

/* Auftrag-Card (volle Breite) */
.card-full { grid-column: 1 / -1; }

.auftrag-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.auftrag-main {
  font-size: 22px;
  font-weight: 700;
  color: var(--text1);
}

.auftrag-sub {
  font-size: 15px;
  color: var(--text2);
}

.tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.tag-cyan  { background: var(--cyan-dim);  color: var(--cyan);  border: 1px solid rgba(0,212,255,0.2); }
.tag-green { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,230,118,0.2); }
.tag-amber { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(255,171,0,0.2); }

.state-tag { margin-top: 10px; }

/* Progress Ring */
.progress-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 0;
}

.ring-container {
  position: relative;
  width: 130px;
  height: 130px;
}

.ring-container svg {
  transform: rotate(-90deg);
}

.ring-bg { stroke: var(--border2); }
.ring-fg {
  stroke: var(--cyan);
  stroke-linecap: round;
  filter: drop-shadow(0 0 4px var(--cyan));
  transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
}

.ring-label {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
}

.ring-number {
  font-size: 28px;
  font-weight: 700;
  color: var(--text1);
  line-height: 1;
}

.ring-sub {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.06em;
}

.ring-pct {
  font-size: 13px;
  font-weight: 600;
  color: var(--cyan);
  margin-top: 10px;
}

/* Stats-Grid */
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.stat {
  padding: 14px 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}

.stat-val {
  font-size: 26px;
  font-weight: 700;
  color: var(--text1);
  line-height: 1;
  margin-bottom: 4px;
}

.stat-val.cyan  { color: var(--cyan); }
.stat-val.green { color: var(--green); }
.stat-val.amber { color: var(--amber); }

.stat-key {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.06em;
}

/* Vorschläge */
.vorschlaege { list-style: none; }

.vorschlag {
  display: flex;
  gap: 10px;
  padding: 12px 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--text2);
  align-items: flex-start;
}

.vorschlag:last-child { margin-bottom: 0; }

.vorschlag-icon {
  color: var(--amber);
  flex-shrink: 0;
  margin-top: 1px;
}

/* Leer-Zustand */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  gap: 14px;
  color: var(--text3);
}

.empty-icon { font-size: 40px; opacity: 0.4; }
.empty-text { font-size: 14px; text-align: center; line-height: 1.6; }

/* ─── Leads View ──────────────────────────────────────────────────────── */
.leads-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.leads-count {
  font-size: 13px;
  color: var(--text3);
}

.leads-count span { color: var(--cyan); font-weight: 600; }

.search-input {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 7px 14px;
  color: var(--text1);
  font-size: 13px;
  outline: none;
  width: 200px;
  transition: border-color 0.2s;
}

.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--cyan); }

.leads-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

.lead-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  transition: border-color 0.2s, transform 0.15s;
  cursor: default;
  position: relative;
  overflow: hidden;
}

.lead-card:hover {
  border-color: var(--border2);
  transform: translateY(-2px);
}

.lead-card::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0;
  transition: opacity 0.2s;
}

.lead-card:hover::after { opacity: 0.4; }

.lead-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 10px;
}

.lead-firma {
  font-size: 14px;
  font-weight: 600;
  color: var(--text1);
  line-height: 1.3;
}

.score-badge {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
}

.score-high { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,230,118,0.25); }
.score-mid  { background: var(--cyan-dim);  color: var(--cyan);  border: 1px solid rgba(0,212,255,0.25); }
.score-low  { background: var(--border);    color: var(--text3); border: 1px solid var(--border2); }

.lead-detail {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 5px;
}

.lead-detail:last-child { margin-bottom: 0; }

.lead-icon { color: var(--text3); font-size: 11px; width: 14px; text-align: center; }

.lead-phone { color: var(--green); }

.lead-branche {
  margin-top: 10px;
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 2px 8px;
}

/* ─── Footer / Refresh ───────────────────────────────────────────────── */
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 28px 16px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.footer-info { font-size: 11px; color: var(--text3); }
.footer-info span { color: var(--text2); }

.refresh-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text3);
  font-size: 11px;
  padding: 5px 12px;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
  letter-spacing: 0.06em;
}

.refresh-btn:hover { color: var(--cyan); border-color: var(--cyan); }

/* ─── Mail-Vorschau ──────────────────────────────────────────────────── */
.mail-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 14px;
  overflow: hidden;
  transition: border-color 0.2s;
}

.mail-card:hover { border-color: var(--border2); }

.mail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}

.mail-header:hover { background: rgba(255,255,255,0.02); }

.mail-meta { flex: 1; min-width: 0; }

.mail-firma {
  font-size: 14px;
  font-weight: 600;
  color: var(--text1);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mail-betreff {
  font-size: 12px;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mail-email {
  font-size: 11px;
  color: var(--cyan);
  font-family: monospace;
  flex-shrink: 0;
}

.mail-chevron {
  color: var(--text3);
  font-size: 12px;
  transition: transform 0.2s;
  flex-shrink: 0;
}

.mail-card.open .mail-chevron { transform: rotate(180deg); }

.mail-body {
  display: none;
  padding: 0 18px 18px;
  border-top: 1px solid var(--border);
}

.mail-card.open .mail-body { display: block; }

.mail-body-text {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.7;
  white-space: pre-wrap;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-top: 14px;
  font-family: inherit;
}

/* ─── Freigabe View ──────────────────────────────────────────────────── */
.freigabe-wrap {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px 0;
}

.freigabe-summary {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 20px;
}

.freigabe-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text1);
  margin-bottom: 18px;
}

.freigabe-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.freigabe-row:last-child { border-bottom: none; }
.freigabe-key { color: var(--text3); }
.freigabe-val { color: var(--text1); font-weight: 600; }
.freigabe-val.green { color: var(--green); }
.freigabe-val.amber { color: var(--amber); }

.freigabe-hinweis {
  background: var(--amber-dim);
  border: 1px solid rgba(255,171,0,0.25);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 13px;
  color: var(--amber);
  line-height: 1.6;
  margin-bottom: 20px;
}

.freigabe-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #005f8a 0%, #00a8d4 100%);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  box-shadow: 0 4px 20px rgba(0,212,255,0.25);
}

.freigabe-btn:hover  { opacity: 0.9; transform: translateY(-1px); }
.freigabe-btn:active { transform: translateY(0); }
.freigabe-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ─── Antworten ──────────────────────────────────────────────────────── */
.antwort-summary {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px;
  color: var(--text1); font-size: 14px; line-height: 1.6; white-space: pre-wrap;
}
.antwort-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px;
  position: relative;
}
.antwort-card.termin { border-color: rgba(0,230,118,0.35); }
.antwort-card.auto   { opacity: 0.62; }
.antwort-firma { font-size: 15px; font-weight: 700; color: var(--text1); margin-bottom: 4px; }
.antwort-meta  { font-size: 12px; color: var(--text2); margin-bottom: 2px; }
.antwort-meta b { color: var(--text1); font-weight: 600; }
.antwort-text {
  margin-top: 10px; padding: 10px 12px; background: var(--bg2);
  border-radius: var(--radius-sm); font-size: 13px; color: var(--text1);
  line-height: 1.55; white-space: pre-wrap; max-height: 220px; overflow: auto;
}
.antwort-badge {
  display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px;
  border-radius: 999px; margin-left: 8px; vertical-align: middle;
}
.badge-termin { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,230,118,0.3); }
.badge-auto   { background: var(--bg2); color: var(--text3); border: 1px solid var(--border); }
.antwort-close-btn {
  margin-top: 12px; padding: 8px 16px; background: var(--green-dim);
  border: 1px solid rgba(0,230,118,0.35); border-radius: var(--radius-sm);
  color: var(--green); font-size: 13px; font-weight: 600; cursor: pointer;
  transition: opacity 0.2s;
}
.antwort-close-btn:hover { opacity: 0.8; }
.antwort-close-btn:disabled { opacity: 0.4; cursor: default; }
.antwort-del-btn {
  margin-top: 12px; margin-left: 8px; padding: 8px 14px; background: transparent;
  border: 1px solid rgba(255,90,90,0.4); border-radius: var(--radius-sm);
  color: #ff8a8a; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: opacity 0.2s;
}
.antwort-del-btn:hover { opacity: 0.8; }
.antwort-del-btn:disabled { opacity: 0.4; cursor: default; }

/* ─── Funnel / Kampagne ──────────────────────────────────────────────── */
.funnel-wrap { background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
.funnel-title { font-size: 15px; font-weight: 700; color: var(--text1); margin-bottom: 16px; }
.funnel-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.funnel-label { width: 150px; font-size: 13px; color: var(--text2); flex-shrink: 0; }
.funnel-bar-bg { flex: 1; height: 22px; background: var(--bg2); border-radius: 6px; overflow: hidden; }
.funnel-bar { height: 100%; background: linear-gradient(90deg, #005f8a, var(--cyan));
  border-radius: 6px; transition: width 0.5s; min-width: 2px; }
.funnel-bar.termin { background: linear-gradient(90deg, #00794d, var(--green)); }
.funnel-num { width: 44px; text-align: right; font-size: 14px; font-weight: 700; color: var(--text1); }
.kampagne-lauf { background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.kampagne-lauf-ziel { font-size: 14px; color: var(--text1); font-weight: 600; }
.kampagne-lauf-sub { font-size: 12px; color: var(--text2); margin-top: 3px; }

/* ─── Modal ──────────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}

.modal-overlay.visible { opacity: 1; pointer-events: auto; }

.modal {
  background: var(--card2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 28px 32px;
  width: min(420px, 90vw);
  box-shadow: var(--shadow);
  transform: scale(0.95);
  transition: transform 0.25s;
}

.modal-overlay.visible .modal { transform: scale(1); }

.modal-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text1);
  margin-bottom: 10px;
}

/* ─── Loading overlay ────────────────────────────────────────────────── */

/* ─── Scrollbar global ───────────────────────────────────────────────── */

/* ─── Setup View ─────────────────────────────────────────────────────── */

.setup-input {

/* Signal-Stapelung: Mehrfach-Auswahl per Checkbox */

              background: var(--card2); }

.coach-row.closing { color: var(--amber); }
.coach-row.closing .tag { color: var(--amber); }
</style>
</head>
<body>

<div class="loading" id="loading"><div class="loader"></div></div>

<!-- Freigabe-Bestätigungs-Modal -->
<div class="modal-overlay" id="freigabeModal">
  <div class="modal">
    <div class="modal-title">Freigabe bestätigen</div>
    <div class="modal-text" id="modalText"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="schliesseModal()">Abbrechen</button>
      <button class="btn-primary" id="modalBestaetigen" onclick="freigabeBestaetigen()">Jetzt senden</button>
    </div>
  </div>
</div>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="orb" id="orb"></div>
      <div class="logo-text"><span>Rebellsystem</span> Sales Operator</div>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <div id="angebotPicker" style="display:none;align-items:center;gap:7px">
        <span style="font-size:12px;color:var(--text2)">Angebot:</span>
        <select id="angebotDropdown" onchange="angebotWechseln(this.value)"
          style="background:var(--bg2);color:var(--text);border:1px solid var(--line);
                 border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer"></select>
      </div>
      <div class="status-dot">
        <div class="dot" id="statusDot"></div>
        <span id="statusLabel">Verbinde…</span>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-view="status">Status</div>
    <div class="tab" data-view="kampagne" id="tab-kampagne">Kampagne</div>
    <div class="tab" data-view="antworten" id="tab-antworten">Antworten</div>
    <div class="tab" data-view="leads">Leads</div>
    <div class="tab" data-view="signalleads" id="tab-signalleads">⚡ Signal-Leads</div>
    <div class="tab" data-view="vorschau">Mail-Vorschau</div>
    <div class="tab" data-view="freigabe">Freigabe</div>
    <div class="tab" data-view="auftrag" id="tab-auftrag">Neuer Auftrag</div>
    <div class="tab" data-view="closer" id="tab-closer">Closer</div>
    <div class="tab" data-view="angebote" id="tab-angebote">Angebote</div>
    <div class="tab" data-view="mandanten" id="tab-mandanten">Mandanten</div>
    <div class="tab" data-view="setup" id="tab-setup">Einrichtung</div>
  </div>

  <!-- Status View -->
  <div class="content">
    <div class="view active" id="view-status">

      <div class="status-grid" id="statusContent">
        <!-- befüllt durch JS -->
      </div>

    </div><!-- /view-status -->

    <!-- Mail-Vorschau View -->
    <div class="view" id="view-vorschau">
      <div class="leads-toolbar">
        <div class="leads-count">
          <span id="mailCount">0</span> Mails zur Vorschau
        </div>
        <input class="search-input" type="text" id="mailSearchInput"
               placeholder="Suchen…" oninput="filterMails(this.value)">
      </div>
      <div id="mailGrid"></div>
    </div>

    <!-- Freigabe View -->
    <div class="view" id="view-freigabe">
      <div id="freigabeContent"></div>
    </div>

    <!-- Kampagne / Trichter View -->
    <div class="view" id="view-kampagne">
      <div id="kampagneContent"></div>
    </div>

    <!-- Antworten View -->
    <div class="view" id="view-antworten">
      <div id="antwortenContent"></div>
    </div>

    <!-- Neuer Auftrag View -->
    <div class="view" id="view-auftrag">
      <div id="auftragContent"></div>
    </div>

    <!-- Leads View -->
    <div class="view" id="view-leads">
      <div class="leads-toolbar">
        <div class="leads-count">
          <span id="leadsCount">0</span> Leads gefunden
        </div>
        <select class="search-input" id="leadSort" style="max-width:200px"
                onchange="setLeadSort(this.value)">
          <option value="score">Sortieren: Score (hoch→niedrig)</option>
          <option value="telefon">Sortieren: Mit Telefon zuerst</option>
          <option value="az">Sortieren: Firma A–Z</option>
        </select>
        <input class="search-input" type="text" id="searchInput"
               placeholder="Suchen…" oninput="filterLeads(this.value)">
      </div>
      <div class="leads-grid" id="leadsGrid">
        <!-- befüllt durch JS -->
      </div>
    </div><!-- /view-leads -->

    <!-- Signal-Leads View — fester Platz für High-Intent-Treffer -->
    <div class="view" id="view-signalleads">
      <div class="leads-toolbar">

          ⚡ <span id="signalLeadsCount">0</span> Signal-Leads — Firmen mit echtem Kaufsignal
        </div>
        <button class="search-input" id="btnSignalReload" style="max-width:160px;cursor:pointer"
                onclick="loadSignalLeads()">↻ Aktualisieren</button>
      </div>

      <div id="closerContent"></div>

<script>
// ─── State ───────────────────────────────────────────────────────────────
let _daten = null;
let _alleLeads = [];
let _alleMails = [];
let _leadSort = 'score';   // score | telefon | az
let _autoRefresh = null;
let _freigabeLimitAktuell = 20;
let _freigabeSendbar = 0;

// ─── Tab-Switching ────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('view-' + t.dataset.view).classList.add('active');
  });
});

// ─── Daten laden ─────────────────────────────────────────────────────────
async function laden() {
  try {
    const r = await fetch('/api/status');
    if (!r.ok) throw new Error(r.status);
    _daten = await r.json();
    renderStatus(_daten);
    renderLeadsFromStatus(_daten);
    renderFreigabe(_daten);
    setOnline();
  } catch (e) {
    setOffline();
  }

  try {
    const r2 = await fetch('/api/leads');
    if (r2.ok) {
      const d = await r2.json();
      if (d.leads && d.leads.length > 0) {
        _alleLeads = d.leads;
        renderLeads(_alleLeads);
        document.getElementById('leadsCount').textContent = _alleLeads.length;
      }
    }
  } catch (_) {}

  try {
    const r3 = await fetch('/api/vorschau', { headers: _adminHeaders({'Content-Type': undefined}) });
    if (r3.ok) {
      const d = await r3.json();
      _alleMails = d.mails || [];
      renderMails(_alleMails);
      document.getElementById('mailCount').textContent = _alleMails.length;
    }
  } catch (_) {}

  // Signal-Leads vorab laden, damit der letzte Stand sofort im Tab steht.
  try { loadSignalLeads(); } catch (_) {}

  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('de-DE');
  document.getElementById('loading').classList.add('hidden');
}

// ─── Status-View rendern ──────────────────────────────────────────────────
function renderStatus(d) {
  if (!d || d.fehler) {
    document.getElementById('statusContent').innerHTML = emptyState(
      '📡', 'Keine Daten verfügbar', 'Noch kein Auftrag ausgeführt oder Engine nicht erreichbar.'
    );
    return;
  }

  const running = false; // V1: aus Datei lesen, kein Live-State
  const ziel = d.auftrag && d.auftrag.lead_anzahl > 0 ? d.auftrag.lead_anzahl : (d.ziel || 0);
  const sauber = d.sauber_telefon || 0;
  const pct = ziel > 0 ? Math.round((sauber / ziel) * 100) : 0;
  const circ = 2 * Math.PI * 52;
  const offset = circ - (pct / 100) * circ;

  const auftragName = (d.auftrag && d.auftrag.zielgruppe)
    ? `${d.auftrag.zielgruppe} · ${d.auftrag.region}`
    : 'Letzter Run';

  const tagClass = d.ziel_erreicht ? 'tag-green' : (d.fehlend > 0 ? 'tag-amber' : 'tag-cyan');
  const tagText  = d.ziel_erreicht ? 'Ziel erreicht' : (running ? 'Suche läuft' : 'Letzte Ergebnisse');

  const vorschlaege = (d.vorschlaege || []).map(v => `
    <li class="vorschlag">
      <span class="vorschlag-icon">💡</span>
      <span>${esc(v)}</span>
    </li>`).join('');

  document.getElementById('statusContent').innerHTML = `

    <!-- Auftrag -->
    <div class="card card-full">
      <div class="card-label">Auftrag</div>
      <div class="auftrag-row">
        <div class="auftrag-main">${esc(auftragName)}</div>
        ${d.auftrag && d.auftrag.angebot ? `<div class="auftrag-sub">· ${esc(d.auftrag.angebot)}</div>` : ''}
      </div>
      <div class="state-tag">
        <span class="tag ${tagClass}">${tagText}</span>
      </div>
    </div>

    <!-- Progress Ring -->
    <div class="card">
      <div class="card-label">Fortschritt</div>
      <div class="progress-wrap">
        <div class="ring-container">
          <svg width="130" height="130" viewBox="0 0 130 130">
            <circle class="ring-bg" cx="65" cy="65" r="52"
              fill="none" stroke-width="7"/>
            <circle class="ring-fg" cx="65" cy="65" r="52"
              fill="none" stroke-width="7"
              stroke-dasharray="${circ}"
              stroke-dashoffset="${offset}"
              id="ringFg"/>
          </svg>
          <div class="ring-label">
            <div class="ring-number">${sauber}</div>
            <div class="ring-sub">VON ${ziel}</div>
          </div>
        </div>
        <div class="ring-pct">${pct}%</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="card">
      <div class="card-label">Kennzahlen</div>
      <div class="stats">
        <div class="stat">
          <div class="stat-val green">${d.sauber_telefon || 0}</div>
          <div class="stat-key">MIT TELEFON</div>
        </div>
        <div class="stat">
          <div class="stat-val cyan">${d.mit_ansprechpartner || 0}</div>
          <div class="stat-key">ANSPRECHPARTNER</div>
        </div>
        <div class="stat">
          <div class="stat-val">${d.pipeline_sendbar || 0}</div>

// ─── Leads rendern ────────────────────────────────────────────────────────
function renderLeadsFromStatus(d) {
  if (!d || !d.top_leads || d.top_leads.length === 0) return;
  if (_alleLeads.length === 0) {
    _alleLeads = d.top_leads;
    renderLeads(_alleLeads);
    document.getElementById('leadsCount').textContent = _alleLeads.length;
  }
}

function sortiereLeads(leads) {
  const arr = [...leads];
  if (_leadSort === 'telefon') {
    arr.sort((a, b) => ((b.telefon ? 1 : 0) - (a.telefon ? 1 : 0)) || ((b.score || 0) - (a.score || 0)));
  } else if (_leadSort === 'az') {
    arr.sort((a, b) => (a.firma || '').localeCompare(b.firma || '', 'de'));
  } else {
    arr.sort((a, b) => (b.score || 0) - (a.score || 0));
  }
  return arr;
}

function setLeadSort(mode) {
  _leadSort = mode;
  filterLeads(document.getElementById('searchInput').value || '');
}

function renderLeads(leads) {
  const grid = document.getElementById('leadsGrid');
  if (!leads || leads.length === 0) {
    grid.innerHTML = emptyState('📋', 'Noch keine Leads',
      'Meist war die Suche nur zu eng gefasst — kein Fehler. ' +
      'Was jetzt hilft: Region erweitern (Nachbarstadt/Bundesland), ' +
      'Branche breiter formulieren oder mit kleiner Menge (5–10) neu starten.');
    return;
  }

  grid.innerHTML = sortiereLeads(leads).map(l => {
    const s = l.score || 0;
    const scoreClass = s >= 70 ? 'score-high' : (s >= 40 ? 'score-mid' : 'score-low');
    const scoreLabel = s > 0 ? s : '—';
    const gruende = (l.gruende || []).map(g => `<div class="lead-detail">
        <span class="lead-icon">✓</span>
        <span style="color:var(--text2);font-size:12px">${esc(g)}</span>
      </div>`).join('');

    return `
    <div class="lead-card">
      <div class="lead-header">
        <div class="lead-firma">${esc(l.firma || '—')}</div>
        <div class="score-badge ${scoreClass}">${scoreLabel}</div>
      </div>

      ${l.ort ? `<div class="lead-detail">
        <span class="lead-icon">📍</span>
        <span>${esc(l.ort)}</span>
      </div>` : ''}

      ${l.telefon ? `<div class="lead-detail">
        <span class="lead-icon">📞</span>
        <span class="lead-phone">${esc(l.telefon)}</span>
      </div>` : ''}

      ${l.ansprechpartner ? `<div class="lead-detail">
        <span class="lead-icon">👤</span>
        <span>${esc(l.ansprechpartner)}</span>
      </div>` : ''}

      ${l.website ? `<div class="lead-detail">
        <span class="lead-icon">🌐</span>
        <span style="color:var(--text3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">
          ${esc(l.website.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</span>
      </div>` : ''}

      ${gruende}

      ${l.naechster_schritt ? `<div class="lead-detail" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">
        <span class="lead-icon">→</span>
        <span style="color:var(--cyan);font-size:12px;font-weight:600">${esc(l.naechster_schritt)}</span>
      </div>` : ''}

      ${l.branche ? `<div class="lead-branche">${esc(l.branche)}</div>` : ''}
    </div>`;
  }).join('');
}

// Dropdown-Auswahl im Freigabe-Tab → effektives Limit (1..50, nie > sendbar).
function onFreigabeLimitChange() {
  const sel = document.getElementById('freigabeLimitSelect');
  if (!sel) return;
  let val = parseInt(sel.value, 10) || 20;
  val = Math.max(1, Math.min(val, 50));          // UI-seitig 1..50 absichern
  const eff = Math.min(val, _freigabeSendbar);   // nie mehr als sendbar
  _freigabeLimitAktuell = eff;
  const setTxt = (id, t) => { const e = document.getElementById(id); if (e) e.textContent = t; };
  setTxt('freigabeNowVal', eff);
  setTxt('freigabeWarnNum', eff + ' Mails');
  setTxt('freigabeBtnNum', eff);
}

// ─── Sitzungs-Schutz: 401 sichtbar machen statt stumm leer zu rendern ──────
// Vorher: ein abgelaufenes/fehlendes Login ließ JEDEN /api-Aufruf mit 401
// zurückkommen; die Render-Funktionen lasen dann ein leeres Objekt und zeigten
// kommentarlos „nichts" (Signal-Leads schienen weg, „↻ Aktualisieren" wirkte
// tot). Jetzt fängt ein fetch-Wrapper jeden 401 zentral ab, zeigt einen klaren
// Hinweis und leitet zur Anmeldung — einmalig, ohne Endlosschleife.
let _sessionWeg = false;
function _sitzungAbgelaufen() {
  if (_sessionWeg) return;
  _sessionWeg = true;
  try { if (typeof _autoRefresh !== 'undefined' && _autoRefresh) clearInterval(_autoRefresh); } catch (_) {}
  try { if (typeof _signalPollTimer !== 'undefined' && _signalPollTimer) clearTimeout(_signalPollTimer); } catch (_) {}
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b91c1c;'
    + 'color:#fff;padding:14px 18px;font:600 14px/1.4 system-ui,sans-serif;text-align:center;'
    + 'box-shadow:0 2px 8px rgba(0,0,0,.3)';
  bar.textContent = '🔒 Sitzung abgelaufen — du wirst zur Anmeldung weitergeleitet…';
  (document.body || document.documentElement).appendChild(bar);
  setTimeout(function () { location.href = '/login'; }, 1400);
}
(function () {
  const _origFetch = window.fetch.bind(window);
  window.fetch = async function (...args) {
    const r = await _origFetch(...args);
    if (r && r.status === 401) _sitzungAbgelaufen();
    return r;
  };
})();

// Token aus localStorage lesen/schreiben — nie ans Backend geloggt.
function _adminToken() { return localStorage.getItem('hso_admin_token') || ''; }
function _adminHeaders(extra) {
  const h = Object.assign({'Content-Type': 'application/json'}, extra || {});
  const t = _adminToken();
  if (t) h['X-Access-Token'] = t;
  return h;
}

const _ABRUF_BTN = `<button class="setup-btn" style="margin-bottom:16px" id="abrufBtn" onclick="antwortenAbrufen()">📥 Postfach jetzt abrufen</button><div id="abrufMsg"></div>`;

function renderAntworten(d) {
  const el = document.getElementById('antwortenContent');
  const liste = (d && d.antworten) || [];
  if (!liste.length) {
    el.innerHTML = _ABRUF_BTN + emptyState('📭', 'Noch keine Antworten',
      'Klick „Postfach jetzt abrufen" — oder ich hole sie alle 5 Min selbst.');
    return;
  }
  // Echte Antworten zuerst, Auto-Antworten ans Ende
  const echte = liste.filter(a => !a.auto_antwort);
  const autos = liste.filter(a => a.auto_antwort);
  const geordnet = echte.concat(autos);

  let html = _ABRUF_BTN;
  if (d.bericht) html += `<div class="antwort-summary">${esc(d.bericht)}</div>`;

  for (const a of geordnet) {
    const termin = a.terminwunsch && !a.erledigt;
    const cls = 'antwort-card' + (termin ? ' termin' : '') + (a.auto_antwort ? ' auto' : '');
    let badge = '';
    if (termin) badge = `<span class="antwort-badge badge-termin">🎯 Termin</span>`;
    else if (a.erledigt) badge = `<span class="antwort-badge badge-auto">✓ erledigt</span>`;
    else if (a.auto_antwort) badge = `<span class="antwort-badge badge-auto">automatisch</span>`;

    const datum = _datumKurz(a.gesendet_am);
    let aufMail = '';
    if (datum) aufMail = `Auf Mail vom <b>${esc(datum)}</b>` + (a.postfach ? ` (${esc(a.postfach)})` : '');
    else if (a.postfach) aufMail = `Postfach: <b>${esc(a.postfach)}</b>`;

    html += `
      <div class="${cls}">
        <div class="antwort-firma">${esc(a.firma || 'Unbekannt')}${badge}</div>
        ${a.von ? `<div class="antwort-meta">Von: <b>${esc(a.von)}</b></div>` : ''}
        ${a.betreff ? `<div class="antwort-meta">Betreff: ${esc(a.betreff)}</div>` : ''}
        ${aufMail ? `<div class="antwort-meta">${aufMail}</div>` : ''}
        ${a.auszug ? `<div class="antwort-text">${esc(a.auszug)}</div>` : ''}
        ${termin ? `<button class="antwort-close-btn" onclick="terminAbschliessen('${esc(a.firma)}', this)">✅ Termin abschließen</button>` : ''}
        <button class="antwort-del-btn" onclick="antwortLoeschen('${esc(a.id)}', this)" title="Diese Nachricht aus der Liste entfernen">🗑 Löschen</button>
      </div>`;
  }
  el.innerHTML = html;
}

async function terminAbschliessen(firma, btn) {
  if (btn) { btn.disabled = true; btn.textContent = '⏳…'; }
  try {
    const r = await fetch('/api/agent/termin-abschliessen', {
      method: 'POST', headers: _adminHeaders(),
      body: JSON.stringify({ firma }),
    });
    const d = await r.json();
    if (d.ok) { ladenAntworten(); }
    else if (btn) { btn.disabled = false; btn.textContent = '✅ Termin abschließen'; alert(d.meldung || 'Fehler'); }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '✅ Termin abschließen'; }
  }
}

async function antwortenAbrufen() {
  const btn = document.getElementById('abrufBtn');
  const msg = document.getElementById('abrufMsg');
  if (btn) { btn.disabled = true; btn.textContent = '📥 Prüfe Postfach…'; }
  try {
    const r = await fetch('/api/agent/antworten-abrufen', { method: 'POST', headers: _adminHeaders() });
    const d = await r.json();
    if (msg) {
      msg.innerHTML = `<div class="freigabe-result ${d.ok ? 'ok' : 'err'}" style="display:block;margin:0 0 16px">${d.ok ? '✅' : '⚠️'} ${esc(d.meldung || '')}</div>`;

  } catch (e) {
    if (msg) msg.innerHTML = `<div class="freigabe-result err" style="display:block;margin:0 0 16px">Verbindungsfehler: ${esc(String(e))}</div>`;

async function antwortLoeschen(id, btn) {
  if (!id) return;

      method: 'POST', headers: _adminHeaders(),

    if (d.ok) { ladenAntworten(); }

const _FUNNEL_STUFEN = [

  ['angeschrieben', '📧 angeschrieben'], ['geantwortet', '💬 geantwortet'],

function renderKampagne(funnelData, laeufeData) {
  const el = document.getElementById('kampagneContent');
  const funnel = (funnelData && funnelData.funnel) || { gesamt: 0, stufen: {} };
  const stufen = funnel.stufen || {};
  const gesamt = funnel.gesamt || 0;
  const max = Math.max(1, ...Object.values(stufen).map(v => v || 0));

  let html = `<div class="funnel-wrap">
    <div class="funnel-title">Kampagnen-Trichter — ${gesamt} Lead${gesamt !== 1 ? 's' : ''} gesamt</div>`;
  if (gesamt === 0) {
    html += `<div class="antwort-meta">Noch keine Leads. Starte einen Auftrag im Tab „Neuer Auftrag".</div>`;
  } else {
    for (const [key, label] of _FUNNEL_STUFEN) {
      const n = stufen[key] || 0;
      const pct = Math.round((n / max) * 100);
      html += `
        <div class="funnel-row">
          <div class="funnel-label">${label}</div>
          <div class="funnel-bar-bg"><div class="funnel-bar ${key === 'termin' ? 'termin' : ''}" style="width:${pct}%"></div></div>
          <div class="funnel-num">${n}</div>
        </div>`;
    }
  }
  html += `</div>`;

  // Laufende / abgeschlossene Kampagnen
  const laeufe = (laeufeData && laeufeData.laeufe) || [];
  if (laeufe.length) {
    html += `<div class="funnel-title" style="margin:18px 0 10px">Kampagnen-Läufe</div>`;
    for (const l of laeufe) {
      const a = l.auftrag || {};
      const f = l.funnel || {};
      const statusMap = {
        laeuft: ['tag-cyan', '🔄 läuft'], wartet_auf_mensch: ['tag-amber', '⏸ wartet auf Freigabe'],
        gesendet: ['tag-green', '✉️ gesendet'], abgeschlossen: ['tag-green', '✓ abgeschlossen'],
        nachgefasst: ['tag-green', '↻ nachgefasst'], aufgegeben: ['tag-amber', '⚠ gestoppt'],
      };
      const [tcls, ttxt] = statusMap[l.status] || ['tag-cyan', l.status || '—'];
      html += `
        <div class="kampagne-lauf">
          <div>
            <div class="kampagne-lauf-ziel">${esc(a.zielgruppe || '—')} · ${esc(a.region || '—')}</div>
            <div class="kampagne-lauf-sub">${f.sendbar || 0}/${a.lead_anzahl || f.ziel || 0} versandbereit · ${l.schritte_anzahl || 0} Schritte</div>
          </div>
          <span class="tag ${tcls}">${ttxt}</span>
        </div>`;
    }
  }
  el.innerHTML = html;
}

let _suchModus = 'branche';
let _signalPollTimer = null;

function setSuchModus(m) {
  _suchModus = (m === 'signal') ? 'signal' : 'branche';
  const bBranche = document.getElementById('modusBranche');
  const bSignal = document.getElementById('modusSignal');
  const sigRow = document.getElementById('signalTypRow');
  const landRow = document.getElementById('landRow');
  const lblRegion = document.getElementById('lblRegion');
  const region = document.getElementById('auf_region');
  const hint = document.getElementById('modusHint');
  const btn = document.getElementById('btnAuftrag');
  const anzahl = document.getElementById('auf_anzahl');
  const aktiv = 'var(--cyan)';
  if (!bBranche || !bSignal) return;
  for (const b of [bBranche, bSignal]) { b.style.opacity = '0.5'; b.style.outline = 'none'; }
  if (_suchModus === 'signal') {
    bSignal.style.opacity = '1'; bSignal.style.outline = '2px solid ' + aktiv;
    sigRow.style.display = '';
    if (landRow) landRow.style.display = '';            // DACH-Auswahl nur bei Signal
    if (lblRegion) lblRegion.textContent = 'Stadt (optional)';
    if (region) { region.required = false; region.placeholder = 'leer = ganzes Land / DACH'; }
    hint.innerHTML = '⚡ <strong>Signal-Suche:</strong> findet nur Firmen, die das Kaufsignal ' +
      'aktuell zeigen (z. B. eine offene Vertriebsstelle) — High-Intent statt Gießkanne. ' +
      'Stadt optional: leer lassen + Land/DACH wählen für eine breite Suche.';
    btn.textContent = '⚡ Signal-Suche starten';
    if (anzahl && parseInt(anzahl.value, 10) > 10) anzahl.value = 8;
  } else {
    bBranche.style.opacity = '1'; bBranche.style.outline = '2px solid ' + aktiv;
    sigRow.style.display = 'none';
    if (landRow) landRow.style.display = 'none';
    if (lblRegion) lblRegion.textContent = 'Region / Ort';
    if (region) { region.required = true; region.placeholder = 'z. B. Köln, NRW'; }
    hint.innerHTML = 'Standard: durchsucht die ganze Branche in der Region. Breite Abdeckung.';
    btn.textContent = '→ Kampagne starten';
  }
}

async function auftragStarten(e) {
  e.preventDefault();
  if (_suchModus === 'signal') { return signalSucheStarten(); }
  const btn = document.getElementById('btnAuftrag');
  const msg = document.getElementById('auftragMsg');
  btn.disabled = true; btn.textContent = '⏳ Startet…';
  const body = {
    zielgruppe: document.getElementById('auf_zielgruppe').value.trim(),
    region:     document.getElementById('auf_region').value.trim(),
    anzahl:     parseInt(document.getElementById('auf_anzahl').value, 10) || 0,
    angebot:    document.getElementById('auf_angebot').value.trim(),
  };
  try {
    const r = await fetch('/api/agent/auftrag', {
      method: 'POST', headers: _adminHeaders(), body: JSON.stringify(body),
    });
    const d = await r.json();
    if (d.ok) {
      msg.innerHTML = `<div class="freigabe-result ok" style="display:block">✅ ${esc(d.meldung)}<br>Der Agent arbeitet jetzt im Hintergrund — schau im Tab „Kampagne" zu.</div>`;
      btn.textContent = '✓ Gestartet';
      document.getElementById('formAuftrag').reset();
    } else {
      msg.innerHTML = `<div class="freigabe-result err" style="display:block">⚠️ ${esc(d.meldung)}</div>`;
      btn.disabled = false; btn.textContent = '→ Kampagne starten';
    }
  } catch (e) {
    msg.innerHTML = `<div class="freigabe-result err" style="display:block">Verbindungsfehler: ${esc(String(e))}</div>`;
    btn.disabled = false; btn.textContent = '→ Kampagne starten';
  }
}

async function signalSucheStarten() {
  const btn = document.getElementById('btnAuftrag');
  const msg = document.getElementById('auftragMsg');
  btn.disabled = true; btn.textContent = '⏳ Startet…';
  const landWahl = (document.getElementById('auf_land') || {}).value || 'de';
  const laender = landWahl === 'dach' ? ['de','at','ch'] : [landWahl];
  const signale = Array.from(
    document.querySelectorAll('#auf_signale input[type=checkbox]:checked')
  ).map(c => c.value);
  if (_suchModus === 'signal' && signale.length === 0) {
    msg.innerHTML = `<div class="freigabe-result err" style="display:block">⚠️ Bitte mindestens ein Kaufsignal auswählen.</div>`;
    btn.disabled = false; btn.textContent = '⚡ Signal-Suche starten';
    return;
  }
  // Intake-Trennung: die Zielbranche darf kein Rollen-/Signalwort sein („Vertrieb"
  // matcht jede Firma → weiche Ausgabe). Sofort-Feedback; der Server prüft erneut.
  const _zb = document.getElementById('auf_zielgruppe').value.trim();
  const _ROLLEN = ['vertrieb','vertriebler','vertriebsmitarbeiter','sales','salesmanager','verkauf','verkäufer','verkaeufer','akquise','akquisition','kaltakquise','neukundengewinnung','sdr','bdr','terminierer','terminierung','außendienst','aussendienst','innendienst','telesales','telefonakquise','closer','setter','manager','leiter','leitung','mitarbeiter','account','accountmanager'];
  const _zbToks = _zb.toLowerCase().split(/[^a-zäöüß0-9]+/)
    .filter(t => t && !['in','im','für','fuer','und','der','die','das','mit','b2b','b2c','bereich','team'].includes(t));
  if (_suchModus === 'signal' && _zbToks.length && _zbToks.every(t => _ROLLEN.includes(t))) {
    msg.innerHTML = `<div class="freigabe-result err" style="display:block">⚠️ &bdquo;${esc(_zb)}&ldquo; ist ein Signal/eine Rolle, keine Branche. Bitte die <b>Zielbranche</b> angeben (z. B. Maschinenbau, IT-Dienstleister, Handwerk) — das Kaufsignal wählst du über die Checkboxen.</div>`;
    btn.disabled = false; btn.textContent = '⚡ Signal-Suche starten';
    return;
  }
  const body = {
    zielgruppe: document.getElementById('auf_zielgruppe').value.trim(),
    region:     document.getElementById('auf_region').value.trim(),
    anzahl:     parseInt(document.getElementById('auf_anzahl').value, 10) || 0,
    angebot:    document.getElementById('auf_angebot').value.trim(),
    signale:    signale,
    linkedin_web: !!(document.getElementById('auf_linkedin_web') || {}).checked,
    linkedin_pro: !!(document.getElementById('auf_linkedin_pro') || {}).checked,
    laender:    laender,
  };
  try {
    const r = await fetch('/api/agent/signal-suche', {
      method: 'POST', headers: _adminHeaders(), body: JSON.stringify(body),
    });
    const d = await r.json();
    if (d.ok) {
      msg.innerHTML = `<div class="freigabe-result ok" style="display:block">⚡ ${esc(d.meldung)}<br>Ergebnisse erscheinen im Tab „⚡ Signal-Leads".</div>`;
      btn.textContent = '⚡ Läuft…';
      gotoTab('signalleads');   // Treffer haben einen festen Platz — nicht mehr im Formular versteckt
      pollSignalLeads();
    } else {
      msg.innerHTML = `<div class="freigabe-result err" style="display:block">⚠️ ${esc(d.meldung)}</div>`;
      btn.disabled = false; btn.textContent = '⚡ Signal-Suche starten';
    }
  } catch (e) {
    msg.innerHTML = `<div class="freigabe-result err" style="display:block">Verbindungsfehler: ${esc(String(e))}</div>`;
    btn.disabled = false; btn.textContent = '⚡ Signal-Suche starten';
  }
}

async function pollSignalLeads() {
  if (_signalPollTimer) clearTimeout(_signalPollTimer);
  let d = {};
  try {
    const r = await fetch('/api/agent/signal-leads', { headers: _adminHeaders({'Content-Type': undefined}) });
    d = await r.json();
  } catch (e) { d = { status: 'fehler', meldung: String(e), leads: [] }; }
  renderSignalLeads(d);
  const btn = document.getElementById('btnAuftrag');
  if (d.status === 'laeuft') {
    _signalPollTimer = setTimeout(pollSignalLeads, 4000);
  } else {
    if (btn) { btn.disabled = false; btn.textContent = '⚡ Signal-Suche starten'; }
  }
}

// Lädt den letzten Signal-Stand einmalig (Tab-Öffnen + Seitenstart) — damit die
// Treffer dauerhaft auffindbar sind und nicht nur während des Pollings sichtbar.
async function loadSignalLeads() {
  let d = {};
  try {
    const r = await fetch('/api/agent/signal-leads', { headers: _adminHeaders({'Content-Type': undefined}) });
    d = await r.json();
  } catch (e) { d = { status: 'keiner', meldung: String(e), leads: [] }; }
  renderSignalLeads(d);
}

// Wechselt programmatisch auf einen Tab (löst dieselbe Logik aus wie ein Klick).
function gotoTab(view) {
  const tab = document.querySelector('.tab[data-view="' + view + '"]');
  if (tab) tab.click();
}

document.getElementById('tab-signalleads').addEventListener('click', loadSignalLeads);

let _signalRuns = [];

function _signalLeadById(leadId) {
  for (const r of _signalRuns) for (const l of (r.leads || [])) if (l.lead_id === leadId) return l;
  return null;
}
function _domId(leadId) { return 'sl_' + String(leadId).replace(/[^a-z0-9]/gi, '_'); }

function renderSignalLeads(d) {
  const box = document.getElementById('signalLeadsTab');
  if (!box) return;
  _signalRuns = d.runs || [];
  const total = _signalRuns.reduce((a, r) => a + ((r.leads || []).length), 0);
  const cnt = document.getElementById('signalLeadsCount');
  if (cnt) cnt.textContent = total;
  const kopf = (t, c) => `<div class="freigabe-result ${c}" style="display:block;margin-bottom:12px">${t}</div>`;
  let head = '';
  if (d.status === 'laeuft') head = kopf(`⏳ ${esc(d.meldung || 'Signal-Suche läuft…')}`, 'ok');
  else if (d.status === 'fehler') head = kopf(`⚠️ ${esc(d.meldung || 'Fehler')}`, 'err');
  else if (d.status === 'fertig') head = kopf(`✅ ${esc(d.meldung || 'Fertig')}`, 'ok');

  if (_signalRuns.length === 0) {
    box.innerHTML = head + emptyState('⚡', 'Noch keine Signal-Suche',
      'Starte unter „Neuer Auftrag" eine Signal-Suche (Modus ⚡). ' +
      'Die Treffer landen hier — getaggt nach Suche, dauerhaft und einzeln löschbar.');
    return;
  }
  const sections = _signalRuns.map(r => {
    const n = (r.leads || []).length;
    const cards = (r.leads || []).map(_signalLeadCard).join('')
      || `<div class="lead-detail" style="color:var(--text3)">— keine Leads in dieser Suche —</div>`;
    return `
    <div style="margin-bottom:24px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)">
        <div style="font-weight:600;color:var(--text2);font-size:13px">🔎 ${esc(r.label || 'Suche')}
          <span style="color:var(--text3);font-weight:400">· ${n} Lead${n === 1 ? '' : 's'}</span></div>
        <button onclick="signalRunLoeschen('${esc(r.run_id)}')"
          style="background:none;border:1px solid var(--border);color:var(--text3);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;white-space:nowrap">🗑 Ganze Suche löschen</button>
      </div>
      ${_suchReport(r.such_report)}
      <div class="leads-grid">${cards}</div>
    </div>`;
  }).join('');
  box.innerHTML = head + sections;
}

function _suchReport(rep) {
  if (!rep || !(rep.quellen || rep.signale)) return '';
  const quellen = rep.quellen || [];
  const signale = rep.signale || [];
  const eintraege = o => Object.keys(o || {}).map(k => `${esc(k)} ${o[k]}`).join(' · ');
  const treffer = eintraege(rep.treffer_je_signal);
  const inLief = eintraege(rep.leads_je_signal);
  const zeile = (lbl, val) => val ? `<div style="color:var(--text3);font-size:11.5px;margin-top:3px"><span style="color:var(--text2)">${lbl}:</span> ${val}</div>` : '';
  return `<div style="background:var(--bg2,rgba(255,255,255,.02));border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:12px">
    <div style="color:var(--text2);font-size:12px;font-weight:600">🔍 Durchsucht: ${signale.length} Signal${signale.length===1?'':'e'} über ${quellen.length} Quellen</div>
    ${zeile('Quellen', quellen.map(esc).join(' · '))}
    ${zeile('Roh-Treffer je Signal', treffer)}
    ${zeile('In dieser Lieferung', inLief)}
  </div>`;
}

function _portalName(url) {
  const u = (url || '').toLowerCase();
  const map = [['stepstone','Stepstone'],['indeed','Indeed'],['linkedin','LinkedIn'],['xing','Xing'],
    ['yourfirm','Yourfirm'],['stellenanzeigen','Stellenanzeigen.de'],['kimeta','Kimeta'],['jobvector','Jobvector'],
    ['meinestadt','meinestadt'],['jobware','Jobware'],['monster','Monster'],['personio','Personio'],
    ['join.com','Join'],['lever','Lever'],['greenhouse','Greenhouse']];
  for (const [m,n] of map) if (u.includes(m)) return n;
  const rest = u.split('//').pop().split('/')[0];
  return rest.replace(/^www\./,'');
}

function _signalZeile(l) {
  const labels = l.signale_labels || (l.signal_label ? [l.signal_label] : []);
  if (!labels.length) return '';
  const cnt = l.signal_count || labels.length;
  if (cnt >= 2) {
    return `<div class="lead-detail" style="align-items:flex-start"><span class="lead-icon">🔥</span>
      <span style="color:#fca5a5;font-size:12px;font-weight:700">${cnt} Signale: ${esc(labels.join(' + '))}</span></div>`;
  }
  return `<div class="lead-detail"><span class="lead-icon">⚡</span>
    <span style="color:var(--green);font-size:12px;font-weight:600">${esc(labels[0])}</span></div>`;
}

function _belegZeilen(l) {
  const belege = (l.signal_belege || []).filter(b => b && (b.quelle_url || b.titel));
  if (belege.length) {
    return belege.map(b => {
      const q = b.quelle_url ? _portalName(b.quelle_url) : '';
      const lbl = b.titel ? esc(String(b.titel).slice(0,70)) : (b.signal_label ? esc(b.signal_label) : 'Anzeige');
      const link = b.quelle_url ? ` <a href="${esc(b.quelle_url)}" target="_blank" rel="noopener" style="color:var(--cyan)">↗</a>` : '';
      return `<div class="lead-detail"><span class="lead-icon">📋</span>
        <span style="color:var(--text3);font-size:11px">${lbl}${q?` · <b style="color:var(--text2)">${esc(q)}</b>`:''}${link}</span></div>`;
    }).join('');
  }
  // Fallback: altes Einzel-Signal
  return l.signal_titel ? `<div class="lead-detail"><span class="lead-icon">📋</span>
    <span style="color:var(--text3);font-size:11px">${esc(l.signal_titel.slice(0,80))}</span></div>` : '';
}

function _premiumBadge(l) {
  // Premium-Gate-Urteil als farbige Plakette: PREMIUM (gruen) / REVIEW (amber) / REJECT (rot).
  const k = l.premium_klasse || '';
  if (!k) return '';
  const map = {
    PREMIUM: ['★ PREMIUM', '#10b981', 'rgba(16,185,129,.14)'],
    REVIEW:  ['⚠ REVIEW',  '#f59e0b', 'rgba(245,158,11,.14)'],
    REJECT:  ['✕ REJECT',  '#ef4444', 'rgba(239,68,68,.14)'],
  };
  const m = map[k] || [k, 'var(--text3)', 'transparent'];
  return `<span title="Premium-Gate" style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;color:${m[1]};background:${m[2]};border:1px solid ${m[1]}66;border-radius:999px;padding:2px 8px;white-space:nowrap">${m[0]}</span>`;
}

function _signalLeadCard(l) {
  const s = l.score || 0;
  const scoreClass = s >= 70 ? 'score-high' : (s >= 40 ? 'score-mid' : 'score-low');
  const did = _domId(l.lead_id);
  const gruende = (l.gruende || []).map(g => `<div class="lead-detail">
      <span class="lead-icon">✓</span>
      <span style="color:var(--text2);font-size:12px">${esc(g)}</span></div>`).join('');
  const btn = (txt, fn, extra) => `<button onclick="${fn}"
    style="background:none;border:1px solid var(--border);color:var(--text3);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;${extra || ''}">${txt}</button>`;
  return `
  <div class="lead-card" id="card_${did}">
    <div class="lead-header">
      <div class="lead-firma">${esc(l.firma || '—')}</div>
      <div style="display:flex;align-items:center;gap:6px">${_premiumBadge(l)}<div class="score-badge ${scoreClass}">${s > 0 ? s : '—'}</div></div>
    </div>
    ${(l.premium_klasse && l.premium_klasse !== 'PREMIUM' && (l.premium_gruende || []).length) ? `<div class="lead-detail" style="margin-top:4px">
      <span class="lead-icon">🔒</span>
      <span style="color:var(--text3);font-size:11px">Nicht Premium: ${esc((l.premium_gruende || [])[0])}</span></div>` : ''}
    ${_signalZeile(l)}
    ${_belegZeilen(l)}

function signalLeadEditToggle(leadId) {

  const row = (label, id, val) => `<div style="margin-bottom:6px">

function _datumKurz(wert) {
  wert = (wert || '').trim();
  if (wert.length >= 10 && wert[4] === '-' && wert[7] === '-') {
    return wert.slice(8,10) + '.' + wert.slice(5,7) + '.' + wert.slice(0,4);
  }
  return wert;
}

async function closerLaden() {
  try {
    const r = await fetch('/api/closer/status', { headers: _adminHeaders({'Content-Type': undefined}) });
    _closerStatus = await r.json();
  } catch(_) {
    _closerStatus = { laeuft: false, closer_verfuegbar: false, meldung: 'Server nicht erreichbar.' };
  }
  try {
    const rs = await fetch('/api/closer/skript', { headers: _adminHeaders({'Content-Type': undefined}) });
    _closerSkript = await rs.json();
  } catch(_) { _closerSkript = { verfuegbar: false }; }
  renderCloser(_closerStatus);
  await closerEventsAktualisieren();
}

async function closerEventsAktualisieren() {
  try {
    const r = await fetch('/api/closer/events', { headers: _adminHeaders({'Content-Type': undefined}) });
    const d = await r.json();
    const el = document.getElementById('closerFeed');
    if (!el) return;
    const events = d.events || [];
    if (events.length === 0) {
      el.innerHTML = '<span class="feed-empty">Noch kein Gespräch.</span>';
      return;
    }
    el.innerHTML = events.map(renderCloserEvent).filter(Boolean).join('');
    el.scrollTop = el.scrollHeight;
  } catch(_) {}
}

function renderCloserEvent(e) {
  if (!e || !e.typ) return '';
  if (e.typ === 'transkript') {
    const seller = e.rolle === 'VERKAEUFER';
    const who = seller ? '🧑 Verkäufer' : '👤 Kunde';
    return `<div class="feed-line ${seller ? 'seller' : 'customer'}">`
         + `<span class="who">${who}:</span> ${esc(e.text || '')}</div>`;
  }
  if (e.typ === 'coaching') {
    const st = (e.signal_type || 'neutral').toLowerCase();
    const icon = st === 'einwand' ? '🔴' : st === 'kaufsignal' ? '🟢' : '⚪';
    const head = `${icon} ${esc((e.signal_label || st).toUpperCase())}`;
    const closing = e.closing_hint && !['null','none',''].includes(String(e.closing_hint).toLowerCase());
    return `<div class="coach-card ${esc(st)}">`
         + `<div class="coach-card-head">${head}</div>`
         + (e.next_answer   ? `<div class="coach-row"><span class="tag">💬 Sag:</span>${esc(e.next_answer)}</div>` : '')
         + (e.next_question ? `<div class="coach-row"><span class="tag">❓ Frag:</span>${esc(e.next_question)}</div>` : '')
         + (closing         ? `<div class="coach-row closing"><span class="tag">🎯 Closing:</span>${esc(e.closing_hint)}</div>` : '')
         + `</div>`;
  }
  if (e.typ === 'log') {
    const t = (e.text || '').trim();
    if (!t) return '';
    return `<div class="feed-log">${esc(t)}</div>`;
  }
  return '';
}

function renderCloserSkript(s) {

function adminTokenSpeichern() {
  const inp = document.getElementById('ui_token_input');
  if (!inp) return;
  const val = inp.value.trim();
  // Platzhalter-Wert nicht als echten Token speichern
  if (val && !val.startsWith('••••')) {
    localStorage.setItem('hso_admin_token', val);
    inp.value = '••••gesetzt';
    const msg = document.getElementById('tokenMsg');
    if (msg) msg.innerHTML = '<span style="color:var(--green)">✓ Token gespeichert.</span>';
  } else if (!val) {
    localStorage.removeItem('hso_admin_token');
    const msg = document.getElementById('tokenMsg');
    if (msg) msg.innerHTML = '<span style="color:var(--text2)">Token entfernt.</span>';
  }
}

  const el = document.getElementById('mandantenContent');
  try {
    const r = await fetch('/api/admin/mandanten', { headers: _adminHeaders({'Content-Type': undefined}) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.meldung || 'Fehler');
    const mand = d.mandanten || [];
    let html = `
      <div style="max-width:600px">
        <div class="setup-h2" style="margin-top:0">Kunden verwalten</div>
        <div id="mandantenMsg"></div>

        <div class="setup-h2" style="margin-top:28px">Neuen Kunden anlegen</div>
        <form id="formMandant" onsubmit="mandantAnlegen(event)">
          <div class="setup-form-row">
            <label class="setup-label">Benutzername</label>
            <input type="text" class="setup-input" id="m_benutzername" placeholder="z.B. acme-gmbh" required>
          </div>
          <div class="setup-form-row">
            <label class="setup-label">Name (angezeigt)</label>
            <input type="text" class="setup-input" id="m_name" placeholder="z.B. ACME GmbH">
          </div>
          <div class="setup-form-row">
            <label class="setup-label">Passwort (mindestens 6 Zeichen)</label>
            <input type="password" class="setup-input" id="m_passwort" placeholder="••••••••" required>
          </div>
          <button type="submit" class="setup-btn" id="btnMandantAdd">+ Kunde hinzufügen</button>
        </form>

        <div class="setup-h2" style="margin-top:28px">Bestehende Kunden</div>
        <div id="mandantenList">`;

    if (mand.length === 0) {
      html += '<div style="color:var(--text3);padding:8px 0">Noch keine Kunden angelegt.</div>';
    } else {
      for (const m of mand) {
        html += `
          <div class="stat" style="margin-bottom:10px;padding:14px 16px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <div class="stat-val" style="margin-bottom:2px;font-size:16px">${esc(m.name)}</div>
                <div class="stat-key">${esc(m.benutzername)} ${m.ist_selbst ? '(du)' : ''}</div>
              </div>
              <div style="display:flex;gap:8px">
                ${!m.ist_selbst ? `<button class="setup-btn" style="padding:6px 12px;font-size:12px;margin:0" onclick="oeffnePWDialog('${esc(m.benutzername)}')">PW ändern</button>
                <button class="setup-btn" style="padding:6px 12px;font-size:12px;margin:0;background:rgba(255,71,87,0.1);color:var(--red);border-color:var(--red)" onclick="mandantLoeschen('${esc(m.benutzername)}')">Löschen</button>` : ''}
              </div>
            </div>
          </div>`;
      }
    }
    html += '</div></div>';
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = emptyState('⚠️', 'Fehler beim Laden', String(e));
  }
}

async function mandantAnlegen(e) {
  e.preventDefault();
  const btn = document.getElementById('btnMandantAdd');
  const msg = document.getElementById('mandantenMsg');
  btn.disabled = true;
  btn.textContent = 'Erstelle…';
  try {
    const r = await fetch('/api/admin/mandanten', {
      method: 'POST',
      headers: _adminHeaders(),
      body: JSON.stringify({
        benutzername: document.getElementById('m_benutzername').value.trim(),
        name: document.getElementById('m_name').value.trim(),
        passwort: document.getElementById('m_passwort').value,
      }),
    });
    const d = await r.json();
    msg.innerHTML = `<div class="freigabe-result ${d.ok ? 'ok' : 'err'}" style="display:block">${d.ok ? '✅' : '⚠️'} ${esc(d.meldung || '')}</div>`;
    if (d.ok) {
      document.getElementById('formMandant').reset();
      setTimeout(() => ladenMandanten(), 1500);
    }
  } catch (e) {
    msg.innerHTML = `<div class="freigabe-result err" style="display:block">Fehler: ${esc(String(e))}</div>`;
  }
  btn.disabled = false;
  btn.textContent = '+ Kunde hinzufügen';
}

function oeffnePWDialog(benutzername) {
  const pw = prompt(`Neues Passwort für "${benutzername}" (mindestens 6 Zeichen):`);
  if (pw) {
    if (pw.length < 6) {
      alert('Passwort zu kurz.');
      return;
    }
    mandantPWSetzen(benutzername, pw);
  }
}

async function mandantPWSetzen(benutzername, pw) {
  try {
    const r = await fetch(`/api/admin/mandanten/${benutzername}`, {
      method: 'POST',
      headers: _adminHeaders(),
      body: JSON.stringify({ action: 'pw', passwort: pw }),
    });
    const d = await r.json();
    alert(d.ok ? '✅ ' + d.meldung : '⚠️ ' + d.meldung);
    if (d.ok) ladenMandanten();
  } catch (e) {
    alert('Fehler: ' + e);
  }
}

async function mandantLoeschen(benutzername) {
  if (!confirm(`Kunde "${benutzername}" wirklich löschen? Das kann nicht rückgängig gemacht werden.`)) return;
  try {
    const r = await fetch(`/api/admin/mandanten/${benutzername}`, {
      method: 'POST',
      headers: _adminHeaders(),
      body: JSON.stringify({ action: 'delete' }),
    });
    const d = await r.json();
    alert(d.ok ? '✅ ' + d.meldung : '⚠️ ' + d.meldung);
    if (d.ok) ladenMandanten();
  } catch (e) {
    alert('Fehler: ' + e);
  }
}

// ─── Angebote (Multi-Offer) ────────────────────────────────────────────────
// Mehrere Akquise-Angebote unter EINEM Account: je eigener Mailtext, Betreff,
// PDF + Such-Vorbelegung. Der Sender bleibt immer derselbe (Engine-.env).
let _angebote = [];
let _angebotAktiv = '';

document.getElementById('tab-angebote').addEventListener('click', ladenAngebote);

async function ladenAngebote() {
  try {
    const r = await fetch('/api/admin/profile', { headers: _adminHeaders({'Content-Type': undefined}) });
    if (r.status === 401 || r.status === 403) { return; }  // kein Admin → still
    const d = await r.json();
    if (!d.ok) throw new Error(d.meldung || 'Fehler');
    _angebote = d.profile || [];
    _angebotAktiv = d.aktiv || (_angebote[0] && _angebote[0].id) || '';
    renderAngebotDropdown();
    renderAngeboteEditor();
  } catch (e) {
    const el = document.getElementById('angeboteContent');
    if (el) el.innerHTML = emptyState('⚠️', 'Angebote nicht geladen', String(e));
  }
}

function renderAngebotDropdown() {
  const picker = document.getElementById('angebotPicker');
  const dd = document.getElementById('angebotDropdown');
  if (!picker || !dd) return;
  if (!_angebote.length) { picker.style.display = 'none'; return; }
  picker.style.display = 'flex';
  dd.innerHTML = _angebote.map(p =>
    `<option value="${esc(p.id)}" ${p.id === _angebotAktiv ? 'selected' : ''}>${esc(p.name)}</option>`
  ).join('');
}

async function angebotWechseln(id) {
  try {
    const r = await fetch('/api/admin/profile/aktiv', {
      method: 'POST', headers: _adminHeaders(), body: JSON.stringify({ id }),
    });
    const d = await r.json();
    if (d.ok) {
      _angebote = d.profile || _angebote;
      _angebotAktiv = d.aktiv;
      renderAngebotDropdown();
      renderAngeboteEditor();
      // Auftrag-Form ggf. neu vorbelegen, falls sichtbar
      if (document.getElementById('view-auftrag').classList.contains('active')) renderAuftragForm();
    }
  } catch (e) { alert('Fehler: ' + e); }
}

function _angebotAktivObj() {
  return _angebote.find(p => p.id === _angebotAktiv) || _angebote[0] || null;
}

function renderAngeboteEditor() {
  const el = document.getElementById('angeboteContent');
  if (!el) return;
  const opts = _angebote.map(p =>
    `<button type="button" class="setup-btn" style="padding:6px 12px;font-size:12px;margin:0 6px 6px 0;
      ${p.id === _angebotAktiv ? 'outline:2px solid var(--cyan)' : 'opacity:.6'}"
      onclick="angebotWechseln('${esc(p.id)}')">${esc(p.name)}${p.id === _angebotAktiv ? ' ✓' : ''}</button>`
  ).join('');
  const p = _angebotAktivObj() || { id:'', name:'', branche:'', stadt:'', lead_anzahl:10, betreff:'', mailtext:'', pdf:'' };
  const istNeu = !p.id;
  el.innerHTML = `
    <div style="max-width:760px">
      <div class="setup-hint">
        🎯 <strong>Angebote</strong> — mehrere Akquise-Angebote unter deinem EINEN Account.
        Jedes Angebot hat eigenen Mailtext, Betreff, PDF-Anhang und Such-Vorbelegung.
        <strong>Der Absender bleibt immer deine Mail</strong> — nur Inhalt + Anhang wechseln.
        Oben rechts schaltest du global um, welches Angebot gerade aktiv ist.
      </div>
      <div class="setup-h2" style="margin-top:18px">Aktives Angebot wählen</div>
      <div style="margin-bottom:6px">${opts}
        <button type="button" class="setup-btn" style="padding:6px 12px;font-size:12px;margin:0 6px 6px 0"
          onclick="angebotNeu()">+ Neues Angebot</button>
      </div>
      <div id="angebotMsg"></div>

      <div class="setup-h2" style="margin-top:24px">${istNeu ? 'Neues Angebot' : 'Angebot bearbeiten'}</div>
      <form id="formAngebot" onsubmit="angebotSpeichern(event)">
        <input type="hidden" id="ang_id" value="${esc(p.id)}">
        <div class="setup-form-row">
          <label class="setup-label">Name (intern, fürs Dropdown)</label>
          <input type="text" class="setup-input" id="ang_name" value="${esc(p.name)}"
            placeholder="z. B. Kunde A – Termin-Akquise" required>
        </div>
        <div class="setup-form-row" style="display:flex;gap:12px">
          <div style="flex:1">
            <label class="setup-label">Such-Branche (Vorbelegung)</label>
            <input type="text" class="setup-input" id="ang_branche" value="${esc(p.branche)}"
              placeholder="z. B. Steuerberater">
          </div>
          <div style="flex:1">
            <label class="setup-label">Such-Stadt (Vorbelegung)</label>
            <input type="text" class="setup-input" id="ang_stadt" value="${esc(p.stadt)}"
              placeholder="z. B. Bonn">
          </div>
          <div style="width:120px">
            <label class="setup-label">Leads</label>
            <input type="number" class="setup-input" id="ang_anzahl" value="${p.lead_anzahl || 10}" min="1">
          </div>
        </div>
        <div class="setup-form-row">
          <label class="setup-label">Betreff der Erstmail <span style="color:var(--text3)">(leer = Standard-Betreff)</span></label>
          <input type="text" class="setup-input" id="ang_betreff" value="${esc(p.betreff)}"
            placeholder="z. B. Mehr Termine für Ihre Kanzlei">
        </div>
        <div class="setup-form-row">
          <label class="setup-label">Mailtext der Erstmail <span style="color:var(--text3)">(leer = Standard-Text)</span></label>
          <textarea class="setup-input" id="ang_mailtext" rows="11"
            style="font-family:inherit;line-height:1.5;resize:vertical"
            placeholder="Platzhalter: {anrede}  {name}  {firma}  {branche}">${esc(p.mailtext)}</textarea>
          <div class="setup-hint" style="margin-top:6px">
            Platzhalter: <code>{anrede}</code> (z. B. „Guten Tag Herr Müller,"),
            <code>{name}</code>, <code>{firma}</code>, <code>{branche}</code>.
            Vergiss die Signatur (Name, Telefon, Mail) nicht im Text.
          </div>
        </div>
        <div class="setup-form-row">
          <label class="setup-label">PDF-Anhang <span style="color:var(--text3)">(leer = Standard-PDF)</span></label>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <input type="file" id="ang_pdf" accept="application/pdf"
              style="font-size:13px;color:var(--text2)">
            <span style="font-size:12px;color:var(--text3)">${p.pdf ? '📎 ' + esc(p.pdf.split(/[\\\\/]/).pop()) : 'noch keins'}</span>
          </div>
          <div class="setup-hint" style="margin-top:6px">PDF wird beim Speichern hochgeladen (max. 8 MB).</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button type="submit" class="setup-btn" id="btnAngebotSave">💾 Speichern</button>
          ${(!istNeu && _angebote.length > 1) ? `<button type="button" class="setup-btn"
            style="background:rgba(255,71,87,0.1);color:var(--red);border-color:var(--red)"
            onclick="angebotLoeschen('${esc(p.id)}')">Löschen</button>` : ''}
        </div>
      </form>
    </div>`;
}

function angebotNeu() {
  _angebote.push({ id:'', name:'', branche:'', stadt:'', lead_anzahl:10, betreff:'', mailtext:'', pdf:'' });
  _angebotAktiv = '';
  renderAngeboteEditor();
}

async function angebotSpeichern(e) {
  e.preventDefault();
  const btn = document.getElementById('btnAngebotSave');
  const msg = document.getElementById('angebotMsg');
  btn.disabled = true; btn.textContent = '⏳ Speichert…';
  const body = {
    id: document.getElementById('ang_id').value.trim(),
    name: document.getElementById('ang_name').value.trim(),
    branche: document.getElementById('ang_branche').value.trim(),
    stadt: document.getElementById('ang_stadt').value.trim(),
    lead_anzahl: parseInt(document.getElementById('ang_anzahl').value, 10) || 10,
    betreff: document.getElementById('ang_betreff').value.trim(),
    mailtext: document.getElementById('ang_mailtext').value,
  };
  try {
    const r = await fetch('/api/admin/profile', {
      method: 'POST', headers: _adminHeaders(), body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.meldung || 'Fehler');
    _angebote = d.profile || [];
    // Ziel-Profil finden (per Name, da neue ID serverseitig vergeben wird)
    const ziel = _angebote.find(x => x.name === body.name) || _angebote.find(x => x.id === body.id);
    const zielId = ziel ? ziel.id : (d.aktiv || body.id);

    // PDF-Upload, falls eine Datei gewählt wurde
    const fileInput = document.getElementById('ang_pdf');
    if (fileInput && fileInput.files && fileInput.files.length) {
      btn.textContent = '⏳ Lädt PDF…';
      const buf = await fileInput.files[0].arrayBuffer();
      const up = await fetch('/api/admin/profile/pdf?id=' + encodeURIComponent(zielId), {
        method: 'POST',
        headers: _adminHeaders({ 'Content-Type': 'application/pdf' }),
        body: buf,
      });
      const ud = await up.json();
      if (!ud.ok) throw new Error('PDF: ' + (ud.meldung || 'Fehler'));
      _angebote = ud.profile || _angebote;
    }
    msg.innerHTML = `<div class="freigabe-result ok" style="display:block">✅ Angebot gespeichert.</div>`;
    _angebotAktiv = zielId;
    renderAngebotDropdown();
    renderAngeboteEditor();
  } catch (err) {
    msg.innerHTML = `<div class="freigabe-result err" style="display:block">⚠️ ${esc(String(err))}</div>`;
    btn.disabled = false; btn.textContent = '💾 Speichern';
  }
}

async function angebotLoeschen(id) {
  if (!confirm('Dieses Angebot wirklich löschen?')) return;
  try {
    const r = await fetch('/api/admin/profile/loeschen', {
      method: 'POST', headers: _adminHeaders(), body: JSON.stringify({ id }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.meldung || 'Fehler');
    _angebote = d.profile || [];
    _angebotAktiv = d.aktiv;
    renderAngebotDropdown();
    renderAngeboteEditor();
  } catch (e) { alert('Fehler: ' + e); }
}
</script>
</body>
</html>
