<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KundenAgent – Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 380px;
  }
  .logo {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo h1 {
    font-size: 22px;
    font-weight: 700;
    color: #7c85f5;
    letter-spacing: -0.5px;
  }
  .logo p {
    font-size: 13px;
    color: #64748b;
    margin-top: 4px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    padding: 10px 14px;
    background: #0f1117;
    border: 1px solid #2d3148;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #7c85f5; }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 11px;
    background: #7c85f5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #6470e8; }
  button:disabled { background: #3d4260; cursor: not-allowed; }
  .fehler {
    margin-top: 14px;
    padding: 10px 14px;
    background: #2d1a1a;
    border: 1px solid #7f1d1d;
    border-radius: 8px;
    font-size: 13px;
    color: #fca5a5;
    display: none;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>KundenAgent</h1>
    <p>Bitte anmelden um fortzufahren</p>
  </div>
  <form id="loginForm">
    <label for="benutzername">Benutzername</label>
    <input id="benutzername" type="text" autocomplete="username" autofocus placeholder="admin">
    <label for="passwort">Passwort</label>
    <input id="passwort" type="password" autocomplete="current-password" placeholder="••••••••">
    <button type="submit" id="btn">Anmelden</button>
  </form>
  <div class="fehler" id="fehler"></div>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btn");
  const fehlerEl = document.getElementById("fehler");
  fehlerEl.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Anmelden …";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        benutzername: document.getElementById("benutzername").value.trim(),
        passwort: document.getElementById("passwort").value,
      }),
    });
    const d = await res.json();
    if (d.ok) {
      if (d.name) sessionStorage.setItem('ka_name', d.name);
      window.location.href = "/";
    } else {
      fehlerEl.textContent = d.meldung || "Anmeldung fehlgeschlagen.";
      fehlerEl.style.display = "block";
    }
  } catch {
    fehlerEl.textContent = "Verbindungsfehler. Server erreichbar?";
    fehlerEl.style.display = "block";
  }
  btn.disabled = false;
  btn.textContent = "Anmelden";
});
</script>
</body>
</html>
